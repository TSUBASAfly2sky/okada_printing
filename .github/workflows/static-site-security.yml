name: Static site security check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 1 * * 1"

permissions:
  contents: read

jobs:
  verify-static-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reject PHP and legacy WordPress server files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t forbidden_files < <(
            find . -type f \
              \( -iname '*.php' \
                 -o -iname 'composer.json' \
                 -o -iname 'composer.lock' \
                 -o -iname 'wp-config.php' \
                 -o -iname '.htaccess' \) \
              -not -path './.git/*' \
              -print
          )

          if ((${#forbidden_files[@]})); then
            printf 'PHP or legacy server files are not allowed in this static site:\n'
            printf ' - %s\n' "${forbidden_files[@]}"
            exit 1
          fi

          echo 'Verified: the site contains no PHP or legacy WordPress server files.'
